name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  tests:
    name: Python ${{ matrix.python-version }} / warning-strict offline tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install locked test dependencies
        run: |
          python -m pip install --require-hashes \
            -r ci/requirements-build.lock \
            -r ci/requirements-runtime.lock
          python -m pip install --no-build-isolation --no-deps --editable .
          python -m pip check

      - name: Verify the offline guard and run the full suite
        env:
          PYTHONPATH: ${{ github.workspace }}/ci/offline_guard
          PYTHONWARNINGS: error
        run: |
          python ci/verify_offline_guard.py
          python -m compileall -q -f src tests ci
          python -m unittest discover -s tests -v

  package:
    name: Clean wheel and source parity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Fix ZIP member timestamps so repeated builds from the same source are stable.
      SOURCE_DATE_EPOCH: "1725148800"

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Install locked build dependencies
        run: |
          python -m pip install --require-hashes \
            -r ci/requirements-build.lock \
            -r ci/requirements-runtime.lock

      - name: Build and inspect one wheel
        id: wheel
        env:
          PYTHONWARNINGS: error
        run: |
          wheelhouse="${RUNNER_TEMP}/throttle-wheelhouse"
          python -m build --wheel --no-isolation --outdir "${wheelhouse}"

          mapfile -t wheels < <(find "${wheelhouse}" -maxdepth 1 -type f -name '*.whl' -print)
          if [[ ${#wheels[@]} -ne 1 ]]; then
            printf 'expected exactly one wheel, found %s\n' "${#wheels[@]}" >&2
            exit 1
          fi

          python ci/verify_wheel.py "${wheels[0]}"
          printf 'path=%s\n' "${wheels[0]}" >> "${GITHUB_OUTPUT}"

      - name: Install and test only the built wheel in a clean environment
        env:
          PYTHONWARNINGS: error
        run: |
          clean_env="${RUNNER_TEMP}/throttle-clean-wheel"
          python -m venv "${clean_env}"
          "${clean_env}/bin/python" -m pip install --require-hashes \
            -r ci/requirements-runtime.lock
          "${clean_env}/bin/python" -m pip install --no-deps "${{ steps.wheel.outputs.path }}"
          "${clean_env}/bin/python" -m pip check

          cd "${RUNNER_TEMP}"
          PYTHONPATH="${GITHUB_WORKSPACE}/ci/offline_guard" \
            "${clean_env}/bin/python" "${GITHUB_WORKSPACE}/ci/verify_installed_wheel.py" \
            --workspace "${GITHUB_WORKSPACE}"
          PYTHONPATH="${GITHUB_WORKSPACE}/ci/offline_guard" \
            "${clean_env}/bin/python" "${GITHUB_WORKSPACE}/ci/verify_offline_guard.py"
          PYTHONPATH="${GITHUB_WORKSPACE}/ci/offline_guard" \
            "${clean_env}/bin/python" -m unittest discover \
            -s "${GITHUB_WORKSPACE}/tests" -v
